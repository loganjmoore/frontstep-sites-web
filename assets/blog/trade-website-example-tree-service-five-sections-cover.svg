<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Five stacked sections of a tree service website labeled hero, services, proof, service area, and contact">
  <rect width="1200" height="630" fill="#eceeec"/>
  <rect x="46" y="46" width="1120" height="550" fill="#111312"/>
  <rect x="40" y="40" width="1120" height="550" fill="#ffffff" stroke="#111312" stroke-width="3"/>
  <g transform="translate(1030,66)"><rect width="34" height="34" fill="#ffd60a"/><path d="M6 27h22v-5H17v-5h-5v-5H6z" fill="#111312"/></g>
  <text x="80" y="98" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#474d4b">FRONT STEP SITES BLOG</text>
  <text x="78" y="194" font-family="Arial, sans-serif" font-size="51" font-weight="800" fill="#111312">Inside a tree service website</text>
  <text x="80" y="249" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#474d4b">Five sections, five customer questions</text>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111312">
    <g transform="translate(80,326)"><rect width="200" height="150" fill="#ffd60a" stroke="#111312" stroke-width="2"/><text x="18" y="38" font-size="16" letter-spacing="1">01</text><text x="18" y="91" font-size="25">HERO</text><text x="18" y="122" font-size="16" font-weight="400">Service + area</text></g>
    <g transform="translate(290,326)"><rect width="200" height="150" fill="#ffffff" stroke="#111312" stroke-width="2"/><text x="18" y="38" font-size="16" letter-spacing="1">02</text><text x="18" y="91" font-size="25">SERVICES</text><text x="18" y="122" font-size="16" font-weight="400">Choose the job</text></g>
    <g transform="translate(500,326)"><rect width="200" height="150" fill="#ffffff" stroke="#111312" stroke-width="2"/><text x="18" y="38" font-size="16" letter-spacing="1">03</text><text x="18" y="91" font-size="25">PROOF</text><text x="18" y="122" font-size="16" font-weight="400">Verify the claim</text></g>
    <g transform="translate(710,326)"><rect width="200" height="150" fill="#ffffff" stroke="#111312" stroke-width="2"/><text x="18" y="38" font-size="16" letter-spacing="1">04</text><text x="18" y="91" font-size="25">AREA</text><text x="18" y="122" font-size="16" font-weight="400">Confirm coverage</text></g>
    <g transform="translate(920,326)"><rect width="200" height="150" fill="#111312" stroke="#111312" stroke-width="2"/><text x="18" y="38" font-size="16" letter-spacing="1" fill="#ffffff">05</text><text x="18" y="91" font-size="25" fill="#ffffff">CONTACT</text><text x="18" y="122" font-size="16" font-weight="400" fill="#ffffff">Make the handoff</text></g>
  </g>
  <path d="M80 521h1040" stroke="#111312" stroke-width="3"/><path d="M1098 509l22 12-22 12" fill="none" stroke="#111312" stroke-width="3"/>
  <text x="80" y="560" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#474d4b">FROM FIRST LOOK TO USEFUL INQUIRY</text>
