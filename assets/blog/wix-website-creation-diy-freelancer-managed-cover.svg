<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Wix website creation routes compared</title>
  <desc id="desc">Three paths compare DIY Wix, a Wix freelancer, and a managed website service.</desc>
  <rect width="1200" height="630" fill="#eceeec"/>
  <text x="70" y="92" fill="#111312" font-family="Arial, sans-serif" font-size="24" font-weight="800">WEBSITE CREATION · THREE ROUTES</text>
  <text x="70" y="166" fill="#111312" font-family="Arial, sans-serif" font-size="54" font-weight="900">Who does the website work?</text>
  <g font-family="Arial, sans-serif" fill="#111312">
    <rect x="70" y="226" width="318" height="294" fill="#fff" stroke="#111312" stroke-width="4"/>
    <text x="100" y="284" font-size="22" font-weight="700">ROUTE 1</text><text x="100" y="348" font-size="44" font-weight="900">DIY WIX</text>
    <text x="100" y="410" font-size="24">You build.</text><text x="100" y="446" font-size="24">You update.</text>
    <rect x="441" y="226" width="318" height="294" fill="#fff" stroke="#111312" stroke-width="4"/>
    <text x="471" y="284" font-size="22" font-weight="700">ROUTE 2</text><text x="471" y="348" font-size="36" font-weight="900">FREELANCER</text>
    <text x="471" y="410" font-size="24">They build.</text><text x="471" y="446" font-size="24">Agree on updates.</text>
    <rect x="812" y="226" width="318" height="294" fill="#ffd60a" stroke="#111312" stroke-width="4"/>
    <text x="842" y="284" font-size="22" font-weight="700">ROUTE 3</text><text x="842" y="348" font-size="40" font-weight="900">MANAGED</text>
    <text x="842" y="410" font-size="24">They build.</text><text x="842" y="446" font-size="24">You send requests.</text>
  </g>
  <path d="M70 564h1060" stroke="#111312" stroke-width="4"/>
  <text x="70" y="602" fill="#111312" font-family="Arial, sans-serif" font-size="22" font-weight="700">COMPARE CONTROL · WORKLOAD · COST · EXIT</text>
</svg>
