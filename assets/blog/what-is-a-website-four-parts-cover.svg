    <g transform="translate(735,405)"><circle r="70" fill="#ffffff" stroke="#111312" stroke-width="3"/><text y="-4" font-size="22" font-weight="800" fill="#111312">PAGES</text><text y="25" font-size="16" font-weight="600" fill="#474d4b">organization</text></g>
    <g transform="translate(1005,405)"><circle r="70" fill="#111312"/><text y="-4" font-size="22" font-weight="800" fill="#ffffff">CONTENT</text><text y="25" font-size="16" font-weight="600" fill="#ffd60a">meaning</text></g>
