  <text x="78" y="100" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#474d4b">FRONT STEP SITES BLOG</text>
  <text x="78" y="196" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#111312">What is a website?</text>
  <text x="80" y="250" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#474d4b">Four parts, one working site.</text>
