name: FrontStep public trade discovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-trades:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - host: canonical
            origin: https://frontstepsites.com
          - host: provider
            origin: https://frontstep-sites.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/front-browser" --no-save --no-package-lock playwright-core@1.62.1
      - run: NODE_PATH="$RUNNER_TEMP/front-browser/node_modules" node tests/seo/trades.browser.cjs
        env:
          FRONT_ORIGIN: ${{ matrix.origin }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: front-trades-${{ matrix.host }}
          path: test-results/trades/
          if-no-files-found: error
          retention-days: 7
